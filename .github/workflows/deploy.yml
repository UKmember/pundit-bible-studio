name: 2. Deploy app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/heartbeat.txt']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.pages.outputs.page_url }}' }
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Deploy the Claude functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      - name: Build the app
        run: python3 build.py && node jobs/config.mjs
        env:
          SCAN_NOTE: ${{ vars.SCAN_NOTE }}
          MONTHLY_BUDGET_GBP: ${{ vars.MONTHLY_BUDGET_GBP }}
          HF_BUDGET_GBP: ${{ vars.HF_BUDGET_GBP }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: pages
        uses: actions/deploy-pages@v4
